<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ГОСТ CAD/CAM Генератор конических зубчатых колес (EDM)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #121212; color: #e0e0e0; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui { 
            position: absolute; top: 15px; left: 15px; background: rgba(30, 30, 30, 0.95); 
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); 
            z-index: 10; border: 1px solid #444; width: 340px; max-height: 92vh; overflow-y: auto;
        }
        h3 { margin-top: 0; color: #4fc3f7; font-size: 15px; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .control-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 12px; color: #bbb; }
        input { width: 100px; padding: 4px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; text-align: center; font-size: 12px; }
        button { width: 100%; padding: 8px; background: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; transition: background 0.2s; }
        button:hover { background: #039be5; }
        button.secondary { background: #388e3c; margin-top: 4px; }
        button.secondary:hover { background: #43a047; }
        .section-title { font-size: 11px; font-weight: bold; color: #81d4fa; margin: 10px 0 4px 0; text-transform: uppercase; border-left: 3px solid #0288d1; padding-left: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h3>ГОСТ Параметры (Конические колеса)</h3>
    
    <div class="section-title">1. Основные геометрические параметры</div>
    <div class="control-group"><label>Модуль внешний me:</label><input type="number" id="p-me" value="3.0" step="0.5"></div>
    <div class="control-group"><label>Число зубьев z:</label><input type="number" id="p-z" value="36" step="1"></div>
    <div class="control-group"><label>Внешнее конусное расстояние Re:</label><input type="number" id="p-re" value="76.368" step="0.001"></div>
    <div class="control-group"><label>Ширина венца b:</label><input type="number" id="p-b" value="23.0" step="0.1"></div>
    <div class="control-group"><label>Угол делительного конуса delta (°):</label><input type="number" id="p-delta" value="45.0" step="0.1"></div>
    <div class="control-group"><label>Угол профиля alpha (°):</label><input type="number" id="p-alpha" value="20.0" step="0.1"></div>

    <div class="section-title">2. ГОСТ Коэффициенты (ГОСТ 19325)</div>
    <div class="control-group"><label>Коэф. высоты головки ha*:</label><input type="number" id="p-ha" value="1.0" step="0.05"></div>
    <div class="control-group"><label>Коэф. радиального зазора c*:</label><input type="number" id="p-c" value="0.2" step="0.01"></div>
    <div class="control-group"><label>Коэф. смещения исходного контура x:</label><input type="number" id="p-x" value="0.0" step="0.05"></div>
    <div class="control-group"><label>Утонение зуба Sy_mid:</label><input type="number" id="p-sy" value="0.028" step="0.001"></div>

    <div class="section-title">3. Кинематика станка (ALK800FU)</div>
    <div class="control-group"><label>Угол наклона оси A delta_f (°):</label><input type="number" id="p-delta-f" value="42.3011" step="0.0001"></div>
    <div class="control-group"><label>Радиус проволоки + искра (D1):</label><input type="number" id="p-offset" value="0.100" step="0.005"></div>

    <button onclick="rebuildApp()">Пересчитать по ГОСТу</button>
    <button class="secondary" onclick="downloadNC()">Скачать G-код (.nc)</button>
    <button class="secondary" onclick="downloadDXF()">Скачать DXF (Верх/Низ)</button>
</div>

<div id="canvas-container"></div>

<script>
    let scene, camera, renderer, wireframeGroup;
    let cachedContours = { top: [], bottom: [] };

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        camera.position.set(0, -110, 90);
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(50, -100, 150);
        scene.add(light);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        rebuildApp();
        animate();
    }

    // Полный расчет по ГОСТ с учетом коэффициентов смещения и высоты
    function generateToothContours() {
        const me = parseFloat(document.getElementById('p-me').value);
        const z = parseInt(document.getElementById('p-z').value);
        const Re = parseFloat(document.getElementById('p-re').value);
        const b = parseFloat(document.getElementById('p-b').value);
        const delta = parseFloat(document.getElementById('p-delta').value) * Math.PI / 180;
        const alpha = parseFloat(document.getElementById('p-alpha').value) * Math.PI / 180;
        
        const ha_star = parseFloat(document.getElementById('p-ha').value);
        const c_star = parseFloat(document.getElementById('p-c').value);
        const x_shift = parseFloat(document.getElementById('p-x').value);
        const delta_s_mid = parseFloat(document.getElementById('p-sy').value);
        const delta_f = parseFloat(document.getElementById('p-delta-f').value) * Math.PI / 180;

        const Ri = Re - b;
        const Rm = Re - b / 2;
        const theta_f = delta - delta_f;
        const H_cut = b * Math.cos(theta_f);

        function buildContour(R_cone) {
            const R_ratio = R_cone / Re;
            const me_local = me * R_ratio;
            
            // ГОСТовские высоты головки и ножки с учетом внешнего модуля и смещения
            const h_a = (ha_star + x_shift * (1 - R_ratio)) * me_local;
            const h_f = (ha_star + c_star - x_shift * (1 - R_ratio)) * me_local;

            const r_v = R_cone;
            const z_v = z / Math.cos(delta); // эквивалентное число зубьев
            const r_b = r_v * Math.cos(alpha);
            const r_a = r_v + h_a;
            const r_root = r_v - h_f;
            const r_start = Math.max(r_b, r_root);

            const tau_v = 2.0 * Math.PI / z_v;
            const delta_s_cone = delta_s_mid * (R_cone / Rm);
            // Толщина и положение по эвольвенте
            const psi_b = (tau_v / 4.0) + (delta_s_cone / (2.0 * r_v)) + (2 * x_shift * Math.tan(alpha) / z) - (Math.tan(alpha) - alpha);
            const H_tooth_ortho = (h_a + h_f) * Math.cos(theta_f);

            const right_inv = [];
            for (let r of linspace(r_start + 0.02 * me_local, r_a, 45)) {
                let alpha_r = Math.acos(Math.min(1.0, r_b / r));
                let inv_r = Math.tan(alpha_r) - alpha_r;
                let th = psi_b + inv_r;
                let x_c = r * Math.sin(th);
                let y_c = r * Math.cos(th) - r_root;
                let R_pt = R_cone + y_c * Math.sin(theta_f);
                let k_ray = R_pt / R_cone;
                right_inv.push({ x: x_c * k_ray, y: y_c * Math.cos(theta_f) - H_tooth_ortho });
            }

            // Плавное переходное скругление в корнях (галтель по ГОСТ)
            const p0 = right_inv[0];
            const fillet = [];
            for (let t of linspace(0, 1, 12)) {
                let x = (1-t)**2 * (p0.x * 0.15) + 2*(1-t)*t * p0.x + t**2 * p0.x;
                let y = (1-t)**2 * (-H_tooth_ortho) + 2*(1-t)*t * (-H_tooth_ortho) + t**2 * p0.y;
                fillet.push({x, y});
            }

            const p_top = right_inv[right_inv.length - 1];
            const p_prev = right_inv[right_inv.length - 2];
            const dx = p_top.x - p_prev.x, dy = p_top.y - p_prev.y;
            const p_lead = { x: p_top.x + dx * ((1.5 - p_top.y) / dy), y: 1.5 };

            const right_side = [...fillet, ...right_inv.slice(1), p_lead];
            const left_side = right_side.slice().reverse().map(p => ({ x: -p.x, y: p.y }));
            
            return [...left_side, ...right_side.slice(1)];
        }

        return { top: buildContour(Re), bottom: buildContour(Ri), H_cut };
    }

    function linspace(start, stop, num) {
        const arr = [];
        const step = (stop - start) / (num - 1);
        for (let i = 0; i < num; i++) arr.push(start + step * i);
        return arr;
    }

    function rebuildApp() {
        if (wireframeGroup) scene.remove(wireframeGroup);
        wireframeGroup = new THREE.Group();

        cachedContours = generateToothContours();
        const { top, bottom, H_cut } = cachedContours;

        const vertices = [];
        const indices = [];

        for (let i = 0; i < top.length; i++) {
            vertices.push(bottom[i].x, bottom[i].y, 0);
            vertices.push(top[i].x, top[i].y, H_cut);
        }

        for (let i = 0; i < top.length - 1; i++) {
            let cb = i * 2, ct = cb + 1;
            let nb = (i + 1) * 2, nt = nb + 1;
            indices.push(cb, nb, ct);
            indices.push(nb, nt, ct);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ 
            color: 0x0288d1, roughness: 0.25, metalness: 0.6, side: THREE.DoubleSide 
        });
        
        wireframeGroup.add(new THREE.Mesh(geometry, material));
        scene.add(wireframeGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (wireframeGroup) wireframeGroup.rotation.z += 0.002;
        renderer.render(scene, camera);
    }

    function downloadNC() {
        const { top, bottom } = cachedContours;
        const z = document.getElementById('p-z').value;
        
        let nc = "%\nO0001 (GOST PARAMETRIC GEAR 4-AXIS EDM)\n";
        nc += "G21\nG90\nG92 X0 Y0 U0 V0 C0\n";
        nc += `M98 P1001 L${z}\nM02\n\n`;
        nc += "O1001\n";
        nc += `G01 G42 X${bottom[0].x.toFixed(5)} Y${bottom[0].y.toFixed(5)} U${top[0].x.toFixed(5)} V${top[0].y.toFixed(5)} D1 F60.0\n`;
        
        for (let i = 1; i < top.length; i++) {
            nc += `G01 X${bottom[i].x.toFixed(5)} Y${bottom[i].y.toFixed(5)} U${top[i].x.toFixed(5)} V${top[i].y.toFixed(5)}\n`;
        }
        
        nc += "G01 G40 X0 Y0 U0 V0\nG91\nG00 C" + (360 / z).toFixed(3) + "\nG90\nM99\n%";
        downloadFile(nc, "gost_gear_program.nc", "text/plain");
    }

    function downloadDXF() {
        const { top, bottom } = cachedContours;
        let dxf = "0\nSECTION\n2\nENTITIES\n";
        function addPoly(pts, layer) {
            pts.forEach((p, idx) => {
                let next = pts[(idx + 1) % pts.length];
                dxf += `0\nLINE\n8\n${layer}\n10\n${p.x}\n20\n${p.y}\n30\n0\n11\n${next.x}\n21\n${next.y}\n31\n0\n`;
            });
        }
        addPoly(bottom, "SMALL_END_XY");
        addPoly(top, "LARGE_END_UV");
        dxf += "0\nENDSEC\n0\nEOF";
        downloadFile(dxf, "gost_gear_contours.dxf", "application/dxf");
    }

    function downloadFile(content, filename, contentType) {
        const a = document.createElement('a');
        const file = new Blob([content], { type: contentType });
        a.href = URL.createObjectURL(file);
        a.download = filename;
        a.click();
    }

    init3D();
</script>

</body>
</html>
