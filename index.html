<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- КРИТИЧНО ДЛЯ МОБИЛЬНЫХ: Отключает зум всей страницы и адаптирует под экран -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Профессиональный CAD/CAM Генератор (EDM)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; }
        #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }
        
        #ui-toggle {
            position: absolute; top: 15px; right: 15px; background: #0288d1; color: white;
            padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;
            z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none;
        }

        #ui { 
            position: absolute; top: 15px; left: 15px; background: rgba(20, 20, 20, 0.96); 
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 25px rgba(0,0,0,0.8); 
            z-index: 10; border: 1px solid #333; width: 340px; max-height: 94vh; overflow-y: auto;
            transition: opacity 0.3s, transform 0.3s;
            box-sizing: border-box;
        }
        
        #ui.hidden { opacity: 0; pointer-events: none; transform: translateY(-20px); }

        h3 { margin-top: 0; color: #4fc3f7; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .control-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 12px; color: #aaa; }
        input, select { width: 110px; padding: 5px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; font-size: 13px; }
        button { width: 100%; padding: 10px; background: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; transition: background 0.2s; font-size: 13px; }
        button:hover { background: #039be5; }
        button.secondary { background: #388e3c; }
        button.secondary:hover { background: #43a047; }
        button.accent { background: #f57c00; }
        button.accent:hover { background: #fb8c00; }
        .section-title { font-size: 12px; font-weight: bold; color: #81d4fa; margin: 12px 0 6px 0; text-transform: uppercase; border-left: 3px solid #0288d1; padding-left: 6px; }
        #status-box { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 12px; background: #1b5e20; color: #c8e6c9; border: 1px solid #2e7d32; text-align: center;}
        #status-box.warning { background: #b71c1c; color: #ffcdd2; border: 1px solid #c62828; }
        .row-btns { display: flex; gap: 8px; }

        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            #ui-toggle { display: block; }
            #ui { 
                width: calc(100vw - 30px); 
                top: 70px; 
                max-height: calc(100vh - 90px);
            }
            input, select { width: 120px; padding: 8px; }
            button { padding: 14px; font-size: 14px; }
            label { font-size: 14px; }
            .section-title { font-size: 13px; margin: 15px 0 8px 0; }
        }
    </style>
    <!-- Основная библиотека Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls для управления вращением с помощью мыши и сенсора -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui-toggle" onclick="toggleUI()">⚙️ Настройки</div>

<div id="ui">
    <h3><span>CAD/CAM Шестерни</span> <span style="font-size:11px; color:#888;">v4.0 Mobile</span></h3>
    <div id="status-box">Геометрия стабильна.</div>

    <div class="section-title">1. Параметры по ГОСТ / Чертежу</div>
    <div class="control-group"><label>Модуль внешний me:</label><input type="number" id="p-me" value="3.0" step="0.5"></div>
    <div class="control-group"><label>Число зубьев z:</label><input type="number" id="p-z" value="36" step="1"></div>
    <div class="control-group"><label>Внешний конус Re:</label><input type="number" id="p-re" value="76.368" step="0.001"></div>
    <div class="control-group"><label>Ширина венца b:</label><input type="number" id="p-b" value="23.0" step="0.1"></div>
    <div class="control-group"><label>Угол конуса delta (°):</label><input type="number" id="p-delta" value="45.0" step="0.1"></div>
    <div class="control-group"><label>Угол профиля alpha (°):</label><input type="number" id="p-alpha" value="20.0" step="0.1"></div>

    <div class="section-title">2. Коэффициенты и визуал</div>
    <div class="control-group"><label>Смещение x:</label><input type="number" id="p-x" value="0.0" step="0.05"></div>
    <div class="control-group"><label>Утонение Sy_mid:</label><input type="number" id="p-sy" value="0.028" step="0.001"></div>
    <div class="control-group"><label>Точки (качество):</label><input type="number" id="p-res" value="99" step="1" min="20" max="200"></div>
    <div class="control-group"><label>Вид детали:</label>
        <select id="p-display" onchange="rebuildApp()">
            <option value="full">Вся деталь</option>
            <option value="single">Один рез</option>
        </select>
    </div>
    <div class="control-group"><label>Нить проволоки:</label>
        <select id="p-show-wire" onchange="rebuildApp()">
            <option value="no">Скрыть</option>
            <option value="yes">Показать</option>
        </select>
    </div>

    <div class="section-title">3. Станок и ЭЭО (ALK800FU)</div>
    <div class="control-group"><label>Угол оси A delta_f (°):</label><input type="number" id="p-delta-f" value="42.3011" step="0.0001"></div>
    <div class="control-group"><label>Припуск черн. (мм):</label><input type="number" id="p-allowance" value="0.15" step="0.05"></div>
    <div class="control-group"><label>Искра + радиус D1:</label><input type="number" id="p-offset" value="0.100" step="0.005"></div>

    <button onclick="rebuildApp(); if(window.innerWidth<=768) toggleUI();">Обновить 3D модель</button>
    
    <div class="section-title">4. Экспорт и Пресеты</div>
    <button class="secondary" onclick="downloadNC()">Скачать G-код (.nc)</button>
    <button class="secondary" onclick="downloadDXF()">Скачать DXF</button>
    <div class="row-btns">
        <button class="accent" onclick="savePreset()">Сохранить</button>
        <button class="accent" onclick="loadPreset()">Загрузить</button>
    </div>
</div>

<div id="canvas-container"></div>

<script>
    let scene, camera, renderer, gearGroup, wireGroup, controls;
    let cachedData = { top: [], bottom: [], H_cut: 0, undercut: false };

    function toggleUI() {
        document.getElementById('ui').classList.toggle('hidden');
    }

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Адаптация DPI для экранов мобильных (Retina)
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        camera.position.set(0, -120, 100);
        camera.up.set(0, 0, 1);

        // Интерактивное управление (OrbitControls)
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light = new THREE.DirectionalLight(0xffffff, 0.9);
        light.position.set(60, -120, 180);
        scene.add(light);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        loadPreset(true); 
        rebuildApp();
        animate();
    }

    function generateToothContours() {
        const me = parseFloat(document.getElementById('p-me').value);
        const z = parseInt(document.getElementById('p-z').value);
        const Re = parseFloat(document.getElementById('p-re').value);
        const b = parseFloat(document.getElementById('p-b').value);
        const delta = parseFloat(document.getElementById('p-delta').value) * Math.PI / 180;
        const alpha = parseFloat(document.getElementById('p-alpha').value) * Math.PI / 180;
        
        const x_shift = parseFloat(document.getElementById('p-x').value);
        const delta_s_mid = parseFloat(document.getElementById('p-sy').value);
        const delta_f = parseFloat(document.getElementById('p-delta-f').value) * Math.PI / 180;
        const res = parseInt(document.getElementById('p-res').value);

        const Ri = Re - b;
        const Rm = Re - b / 2;
        const theta_f = delta - delta_f;
        const H_cut = b * Math.cos(theta_f);

        const z_v = z / Math.cos(delta);
        const z_crit = 2 * (1.0 - x_shift) / (Math.sin(alpha)**2);
        const hasUndercut = z_v < z_crit;

        function buildContour(R_cone) {
            const R_ratio = R_cone / Re;
            const me_local = me * R_ratio;
            const h_a = (1.0 + x_shift * (1 - R_ratio)) * me_local;
            const h_f = (1.2 - x_shift * (1 - R_ratio)) * me_local;

            const r_v = R_cone;
            const r_b = r_v * Math.cos(alpha);
            const r_a = r_v + h_a;
            const r_root = r_v - h_f;
            const r_start = Math.max(r_b, r_root);

            const tau_v = 2.0 * Math.PI / z_v;
            const delta_s_cone = delta_s_mid * (R_cone / Rm);
            const psi_b = (tau_v / 4.0) + (delta_s_cone / (2.0 * r_v)) + (2 * x_shift * Math.tan(alpha) / z) - (Math.tan(alpha) - alpha);
            const H_tooth_ortho = (h_a + h_f) * Math.cos(theta_f);

            const right_inv = [];
            for (let r of linspace(r_start + 0.01 * me_local, r_a, res)) {
                let alpha_r = Math.acos(Math.min(1.0, r_b / r));
                let inv_r = Math.tan(alpha_r) - alpha_r;
                let th = psi_b + inv_r;
                let x_c = r * Math.sin(th);
                let y_c = r * Math.cos(th) - r_root;
                let R_pt = R_cone + y_c * Math.sin(theta_f);
                let k_ray = R_pt / R_cone;
                right_inv.push({ x: x_c * k_ray, y: y_c * Math.cos(theta_f) - H_tooth_ortho });
            }

            const p0 = right_inv[0];
            const fillet = [];
            for (let t of linspace(0, 1, 10)) {
                let x = (1-t)**2 * (p0.x * 0.1) + 2*(1-t)*t * p0.x + t**2 * p0.x;
                let y = (1-t)**2 * (-H_tooth_ortho) + 2*(1-t)*t * (-H_tooth_ortho) + t**2 * p0.y;
                fillet.push({x, y});
            }

            const p_top = right_inv[right_inv.length - 1];
            const p_prev = right_inv[right_inv.length - 2];
            const dx = p_top.x - p_prev.x, dy = p_top.y - p_prev.y;
            const p_lead = { x: p_top.x + dx * ((1.5 - p_top.y) / dy), y: 1.5 };

            const right_side = [...fillet, ...right_inv.slice(1), p_lead];
            const left_side = right_side.slice().reverse().map(p => ({ x: -p.x, y: p.y }));
            
            return [...left_side, ...right_side.slice(1)];
        }

        return { top: buildContour(Re), bottom: buildContour(Ri), H_cut, undercut: hasUndercut };
    }

    function linspace(start, stop, num) {
        const arr = [];
        const step = (stop - start) / (num - 1);
        for (let i = 0; i < num; i++) arr.push(start + step * i);
        return arr;
    }

    function rebuildApp() {
        if (gearGroup) scene.remove(gearGroup);
        if (wireGroup) scene.remove(wireGroup);
        
        gearGroup = new THREE.Group();
        wireGroup = new THREE.Group();

        cachedData = generateToothContours();
        const { top, bottom, H_cut, undercut } = cachedData;
        const z = parseInt(document.getElementById('p-z').value);
        const displayMode = document.getElementById('p-display').value;
        const z_total = (displayMode === 'full') ? z : 1;

        const statusBox = document.getElementById('status-box');
        if (undercut) {
            statusBox.className = "warning";
            statusBox.innerHTML = "⚠️ ПОДРЕЗ (z_v < z_крит)!";
        } else {
            statusBox.className = "";
            statusBox.innerHTML = "✅ Геометрия в норме.";
        }

        const vertices = [];
        const indices = [];
        let offset = 0;
        const numPts = top.length;

        for (let k = 0; k < z_total; k++) {
            const angle = k * (2 * Math.PI / z);
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            for (let i = 0; i < numPts; i++) {
                let bx = bottom[i].x * cosA - bottom[i].y * sinA;
                let by = bottom[i].x * sinA + bottom[i].y * cosA;
                vertices.push(bx, by, 0);

                let tx = top[i].x * cosA - top[i].y * sinA;
                let ty = top[i].x * sinA + top[i].y * cosA;
                vertices.push(tx, ty, H_cut);
            }

            for (let i = 0; i < numPts - 1; i++) {
                let cb = offset + i * 2, ct = cb + 1;
                let nb = offset + (i + 1) * 2, nt = nb + 1;
                indices.push(cb, nb, ct);
                indices.push(nb, nt, ct);
            }

            if (displayMode === 'full') {
                let last_b = offset + (numPts - 1) * 2;
                let last_t = last_b + 1;
                let next_first_b = (k === z_total - 1) ? 0 : offset + numPts * 2;
                let next_first_t = next_first_b + 1;

                indices.push(last_b, next_first_b, last_t);
                indices.push(next_first_b, next_first_t, last_t);
            }
            offset += numPts * 2;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({ color: 0x0288d1, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide });
        gearGroup.add(new THREE.Mesh(geo, mat));

        if (document.getElementById('p-show-wire').value === 'yes') {
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffa726, transparent: true, opacity: 0.8 });
            for (let i = 0; i < top.length; i += Math.max(1, Math.floor(top.length / 25))) {
                const points = [
                    new THREE.Vector3(bottom[i].x, bottom[i].y, 0),
                    new THREE.Vector3(top[i].x, top[i].y, H_cut)
                ];
                wireGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), wireMat));
            }
        }

        scene.add(gearGroup);
        scene.add(wireGroup);
    }

    function animate() {
        requestAnimationFrame(animate);
        // Вращение теперь управляется контроллером (мышью/сенсором), а не автоматически
        controls.update(); 
        renderer.render(scene, camera);
    }

    function downloadNC() {
        const { top, bottom } = cachedData;
        const z = document.getElementById('p-z').value;
        const allowance = parseFloat(document.getElementById('p-allowance').value);
        
        let nc = "%\nO0001 (MULTI-PASS 4-AXIS EDM GEAR)\nG21\nG90\nG92 X0 Y0 U0 V0 C0\n\n";
        nc += "(--- ROUGH PASS WITH ALLOWANCE ---)\n";
        nc += `M98 P1001 L${z}\n\n`;
        nc += "(--- FINISH PASS ---)\n";
        nc += `M98 P1002 L${z}\nM02\n\n`;

        nc += "O1001\n";
        nc += `G01 G42 X${(bottom[0].x + allowance).toFixed(5)} Y${bottom[0].y.toFixed(5)} U${(top[0].x + allowance).toFixed(5)} V${top[0].y.toFixed(5)} D1 F80.0\n`;
        for (let i = 1; i < top.length; i++) nc += `G01 X${(bottom[i].x + allowance).toFixed(5)} Y${bottom[i].y.toFixed(5)} U${(top[i].x + allowance).toFixed(5)} V${top[i].y.toFixed(5)}\n`;
        nc += "G01 G40 X0 Y0 U0 V0\nG91\nG00 C" + (360 / z).toFixed(3) + "\nG90\nM99\n\n";

        nc += "O1002\n";
        nc += `G01 G42 X${bottom[0].x.toFixed(5)} Y${bottom[0].y.toFixed(5)} U${top[0].x.toFixed(5)} V${top[0].y.toFixed(5)} D2 F40.0\n`;
        for (let i = 1; i < top.length; i++) nc += `G01 X${bottom[i].x.toFixed(5)} Y${bottom[i].y.toFixed(5)} U${top[i].x.toFixed(5)} V${top[i].y.toFixed(5)}\n`;
        nc += "G01 G40 X0 Y0 U0 V0\nG91\nG00 C" + (360 / z).toFixed(3) + "\nG90\nM99\n%";

        downloadFile(nc, "gear_multipass.nc", "text/plain");
    }

    function downloadDXF() {
        const { top, bottom } = cachedData;
        let dxf = "0\nSECTION\n2\nENTITIES\n";
        function addPoly(pts, layer) {
            pts.forEach((p, idx) => {
                let next = pts[(idx + 1) % pts.length];
                dxf += `0\nLINE\n8\n${layer}\n10\n${p.x}\n20\n${p.y}\n30\n0\n11\n${next.x}\n21\n${next.y}\n31\n0\n`;
            });
        }
        addPoly(bottom, "XY_SMALL_END");
        addPoly(top, "UV_LARGE_END");
        dxf += "0\nENDSEC\n0\nEOF";
        downloadFile(dxf, "gear_contours_pro.dxf", "application/dxf");
    }

    function savePreset() {
        const data = {};
        document.querySelectorAll('#ui input, #ui select').forEach(el => data[el.id] = el.value);
        localStorage.setItem('gear_preset_active', JSON.stringify(data));
        alert('Параметры успешно сохранены!');
    }

    function loadPreset(silent = false) {
        const saved = localStorage.getItem('gear_preset_active');
        if (saved) {
            const data = JSON.parse(saved);
            for (let id in data) {
                const el = document.getElementById(id);
                if (el) el.value = data[id];
            }
            if (!silent) {
                rebuildApp();
                alert('Параметры загружены!');
            }
        }
    }

    function downloadFile(content, filename, contentType) {
        const a = document.createElement('a');
        const file = new Blob([content], { type: contentType });
        a.href = URL.createObjectURL(file);
        a.download = filename;
        a.click();
    }

    init3D();
</script>

</body>
</html>
